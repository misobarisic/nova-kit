name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    name: Linux (Nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Nova v7.0.1 pin
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # Nova v31.11.1 pin
        with:
          github_access_token: ${{ github.token }}
      - run: nix develop --command cargo fmt --all -- --check
      - run: nix develop --command cargo clippy --workspace --locked -- -D warnings
      - run: nix develop --command cargo test --workspace --locked

  windows:
    name: Windows (native)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Nova v7.0.1 pin
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # Nova pin
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo test --workspace --locked
