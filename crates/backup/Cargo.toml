[package]
name = "nova-backup"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Portable, bounded ZIP/JSON backup archive format shared by the Nova applications"

[dependencies]
nova-storage = { path = "../storage", features = ["zip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
